name: Preserve workflow layout
on: workflow_dispatch
# The comment mentions actions/checkout@v2 and must remain unchanged.
jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/workflow-approve' &&
      github.repository_owner == 'prometheus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # The inline comment stays here.
      - uses: 'actions/checkout@v4'
      - uses: "actions/checkout@v4"
      - uses: "actions/\u0063heckout@v4"
      - uses: "actions/checkout@v4" # The version contains a YAML escape.
      - uses: "actions/checkout@v4"
      - uses: "actions/checkout@v4"
      - uses: "actions/checkout@v4"
      - {uses: "actions/checkout@v4", name: "actions/checkout@v2"}
      - "uses": 'actions/checkout@v4'
      - {name: "inline", uses: actions/checkout@v4}
      - {uses: actions/checkout@v4, with: {ref: main}}
      - uses: &checkout actions/checkout@v4
      - uses: *checkout
      - uses: >-
          actions/checkout@v4
      - uses: |-
          actions/checkout@v4
      - run: |
          echo 'uses: actions/checkout@v2'
  inline:
    runs-on: ubuntu-latest
    steps: [{uses: "actions/checkout@v4"}, {uses: 'actions/checkout@v4'}]
